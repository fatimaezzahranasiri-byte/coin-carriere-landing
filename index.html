    <!-- Custom logo replacement -->
    <style>
      .custom-logo-wrap{display:inline-flex;align-items:center;flex-shrink:0;height:36px}
      .custom-logo-wrap img{display:block;height:100%;width:auto;max-height:36px;object-fit:contain}
      header .custom-logo-wrap{height:40px}
      header .custom-logo-wrap img{max-height:40px}
      footer .custom-logo-wrap{height:36px}
      footer .custom-logo-wrap img{max-height:36px;filter:brightness(0) invert(1)}

      /* Company logos in trust marquee - elegant & professional */
      .partner-logo-card{
        display:flex;align-items:center;justify-content:center;
        flex-shrink:0;
        min-width:200px;height:88px;
        padding:18px 28px;
        background:#ffffff;
        border:1px solid rgba(226,232,240,0.8);
        border-radius:16px;
        box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px -2px rgba(15,23,42,0.05);
        transition:all .35s cubic-bezier(.2,.7,.2,1);
      }
      .partner-logo-card:hover{
        transform:translateY(-3px);
        box-shadow:0 4px 8px rgba(15,23,42,0.06), 0 12px 28px -6px rgba(15,23,42,0.12);
        border-color:rgba(0,119,182,0.25);
      }
      .partner-logo-card img{
        max-height:48px;max-width:160px;width:auto;height:auto;
        object-fit:contain;
        filter:grayscale(100%) opacity(.65);
        transition:filter .35s ease;
      }
      .partner-logo-card:hover img{
        filter:grayscale(0%) opacity(1);
      }
      @media (min-width:640px){
        .partner-logo-card{min-width:240px;height:104px;padding:20px 32px}
        .partner-logo-card img{max-height:56px;max-width:180px}
      }
    </style>
    <script>
      (function(){
        var LOGO_URL = "https://cdn.coincarriere.com/wp-content/uploads/2025/11/1762829178875-w23oav1d4pb.png";
        var HERO_IMG_URL = "https://i.ibb.co/j9yzQHqv/Untitled-design-6.png";
        var TESTIMONIAL_IMG_URL = "https://i.ibb.co/JjmQ1p9t/Screenshot-7.png";
        var PARTNER_LOGOS = [
          "https://i.ibb.co/99xzBzwb/1.png",
          "https://i.ibb.co/xtpbPknm/2.png",
          "https://i.ibb.co/XxgCb9Xh/3.png",
          "https://i.ibb.co/B2zNsZty/4.png",
          "https://i.ibb.co/nM5rPHL1/5.png",
          "https://i.ibb.co/XrtPhTkJ/6.png",
          "https://i.ibb.co/F400tv9Q/7.png"
        ];
        // Default company names that need replacing
        var FAKE_NAMES = ["Atlas Construction","Casa Build","Maghreb Infra","Chantier Pro","BTP Solutions","Sahara Travaux","Rabat Génie Civil","Tanger Bâtiment"];

        function replaceLogos(){
          var candidates = document.querySelectorAll('div.inline-flex.items-center.shrink-0');
          candidates.forEach(function(el){
            if(el.dataset.logoReplaced === '1') return;
            var html = el.innerHTML || '';
            if(html.indexOf('CARRIERE') === -1 && html.indexOf('Coin') === -1) return;
            el.innerHTML = '<img src="'+LOGO_URL+'" alt="CoinCarrière" loading="eager" />';
            el.classList.add('custom-logo-wrap');
            el.dataset.logoReplaced = '1';
          });
        }

        function replaceHeroImage(){
          var imgs = document.querySelectorAll('img');
          imgs.forEach(function(img){
            if(img.dataset.heroReplaced === '1') return;
            var src = img.getAttribute('src') || '';
            var alt = img.getAttribute('alt') || '';
            if(src.indexOf('hero-btp') !== -1 || alt.indexOf('Ouvriers BTP marocains sur un chantier') !== -1){
              img.setAttribute('src', HERO_IMG_URL);
              img.dataset.heroReplaced = '1';
            }
          });
        }

        function replaceTestimonial(){
          var imgs = document.querySelectorAll('img');
          imgs.forEach(function(img){
            if(img.dataset.testimonialReplaced === '1') return;
            var src = img.getAttribute('src') || '';
            var alt = img.getAttribute('alt') || '';
            if(src.indexOf('testimonial-1') !== -1 || alt.indexOf('Youssef Amrani') !== -1){
              img.setAttribute('src', TESTIMONIAL_IMG_URL);
              img.dataset.testimonialReplaced = '1';
            }
          });
        }

        function replacePartners(){
          // Find the marquee container in trust section
          // Looking for the flex container with class "flex w-max animate-marquee"
          var marquees = document.querySelectorAll('.animate-marquee');
          marquees.forEach(function(marquee){
            if(marquee.dataset.partnersReplaced === '1') return;
            // Check if it contains the fake company names
            var text = marquee.textContent || '';
            var hasFakeNames = FAKE_NAMES.some(function(n){ return text.indexOf(n) !== -1; });
            if(!hasFakeNames) return;
            // Clear marquee and rebuild with partner logos (duplicate for seamless scroll)
            marquee.innerHTML = '';
            var allLogos = PARTNER_LOGOS.concat(PARTNER_LOGOS);
            allLogos.forEach(function(logoUrl, idx){
              var card = document.createElement('div');
              card.className = 'partner-logo-card';
              var img = document.createElement('img');
              img.src = logoUrl;
              img.alt = 'Partenaire ' + ((idx % PARTNER_LOGOS.length) + 1);
              img.loading = 'lazy';
              card.appendChild(img);
              marquee.appendChild(card);
            });
            marquee.dataset.partnersReplaced = '1';
          });
        }

        function runAll(){
          replaceLogos();
          replaceHeroImage();
          replaceTestimonial();
          replacePartners();
        }

        function start(){
          runAll();
          var observer = new MutationObserver(function(){ runAll(); });
          observer.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['src']});
          setTimeout(function(){ observer.disconnect(); }, 10000);
        }
        if(document.readyState === 'loading'){
          document.addEventListener('DOMContentLoaded', start);
        } else {
          start();
        }
      })();
    </script>

    <!-- Custom logo replacement -->
    <style>
      .custom-logo-wrap{display:inline-flex;align-items:center;flex-shrink:0;height:36px}
      .custom-logo-wrap img{display:block;height:100%;width:auto;max-height:36px;object-fit:contain}
      header .custom-logo-wrap{height:40px}
      header .custom-logo-wrap img{max-height:40px}
      footer .custom-logo-wrap{height:36px}
      footer .custom-logo-wrap img{max-height:36px;filter:brightness(0) invert(1)}

      /* Company logos in trust marquee - elegant & professional */
      .partner-logo-card{
        display:flex;align-items:center;justify-content:center;
        flex-shrink:0;
        min-width:200px;height:88px;
        padding:18px 28px;
        background:#ffffff;
        border:1px solid rgba(226,232,240,0.8);
        border-radius:16px;
        box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 4px 12px -2px rgba(15,23,42,0.05);
        transition:all .35s cubic-bezier(.2,.7,.2,1);
      }
      .partner-logo-card:hover{
        transform:translateY(-3px);
        box-shadow:0 4px 8px rgba(15,23,42,0.06), 0 12px 28px -6px rgba(15,23,42,0.12);
        border-color:rgba(0,119,182,0.25);
      }
      .partner-logo-card img{
        max-height:48px;max-width:160px;width:auto;height:auto;
        object-fit:contain;
        filter:grayscale(100%) opacity(.65);
        transition:filter .35s ease;
      }
      .partner-logo-card:hover img{
        filter:grayscale(0%) opacity(1);
      }
      @media (min-width:640px){
        .partner-logo-card{min-width:240px;height:104px;padding:20px 32px}
        .partner-logo-card img{max-height:56px;max-width:180px}
      }
    </style>
    <script>
      (function(){
        var LOGO_URL = "https://cdn.coincarriere.com/wp-content/uploads/2025/11/1762829178875-w23oav1d4pb.png";
        var HERO_IMG_URL = "https://i.ibb.co/j9yzQHqv/Untitled-design-6.png";
        var TESTIMONIAL_IMG_URL = "https://i.ibb.co/JjmQ1p9t/Screenshot-7.png";
        var PARTNER_LOGOS = [
          "https://i.ibb.co/99xzBzwb/1.png",
          "https://i.ibb.co/xtpbPknm/2.png",
          "https://i.ibb.co/XxgCb9Xh/3.png",
          "https://i.ibb.co/B2zNsZty/4.png",
          "https://i.ibb.co/nM5rPHL1/5.png",
          "https://i.ibb.co/XrtPhTkJ/6.png",
          "https://i.ibb.co/F400tv9Q/7.png"
        ];
        // Default company names that need replacing
        var FAKE_NAMES = ["Atlas Construction","Casa Build","Maghreb Infra","Chantier Pro","BTP Solutions","Sahara Travaux","Rabat Génie Civil","Tanger Bâtiment"];

        function replaceLogos(){
          var candidates = document.querySelectorAll('div.inline-flex.items-center.shrink-0');
          candidates.forEach(function(el){
            if(el.dataset.logoReplaced === '1') return;
            var html = el.innerHTML || '';
            if(html.indexOf('CARRIERE') === -1 && html.indexOf('Coin') === -1) return;
            el.innerHTML = '<img src="'+LOGO_URL+'" alt="CoinCarrière" loading="eager" />';
            el.classList.add('custom-logo-wrap');
            el.dataset.logoReplaced = '1';
          });
        }

        function replaceHeroImage(){
          var imgs = document.querySelectorAll('img');
          imgs.forEach(function(img){
            if(img.dataset.heroReplaced === '1') return;
            var src = img.getAttribute('src') || '';
            var alt = img.getAttribute('alt') || '';
            if(src.indexOf('hero-btp') !== -1 || alt.indexOf('Ouvriers BTP marocains sur un chantier') !== -1){
              img.setAttribute('src', HERO_IMG_URL);
              img.dataset.heroReplaced = '1';
            }
          });
        }

        function replaceTestimonial(){
          var imgs = document.querySelectorAll('img');
          imgs.forEach(function(img){
            if(img.dataset.testimonialReplaced === '1') return;
            var src = img.getAttribute('src') || '';
            var alt = img.getAttribute('alt') || '';
            if(src.indexOf('testimonial-1') !== -1 || alt.indexOf('Youssef Amrani') !== -1){
              img.setAttribute('src', TESTIMONIAL_IMG_URL);
              img.dataset.testimonialReplaced = '1';
            }
          });
        }

        function replacePartners(){
          // Find the marquee container in trust section
          // Looking for the flex container with class "flex w-max animate-marquee"
          var marquees = document.querySelectorAll('.animate-marquee');
          marquees.forEach(function(marquee){
            if(marquee.dataset.partnersReplaced === '1') return;
            // Check if it contains the fake company names
            var text = marquee.textContent || '';
            var hasFakeNames = FAKE_NAMES.some(function(n){ return text.indexOf(n) !== -1; });
            if(!hasFakeNames) return;
            // Clear marquee and rebuild with partner logos (duplicate for seamless scroll)
            marquee.innerHTML = '';
            var allLogos = PARTNER_LOGOS.concat(PARTNER_LOGOS);
            allLogos.forEach(function(logoUrl, idx){
              var card = document.createElement('div');
              card.className = 'partner-logo-card';
              var img = document.createElement('img');
              img.src = logoUrl;
              img.alt = 'Partenaire ' + ((idx % PARTNER_LOGOS.length) + 1);
              img.loading = 'lazy';
              card.appendChild(img);
              marquee.appendChild(card);
            });
            marquee.dataset.partnersReplaced = '1';
          });
        }

        function runAll(){
          replaceLogos();
          replaceHeroImage();
          replaceTestimonial();
          replacePartners();
        }

        function start(){
          runAll();
          var observer = new MutationObserver(function(){ runAll(); });
          observer.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['src']});
          setTimeout(function(){ observer.disconnect(); }, 10000);
        }
        if(document.readyState === 'loading'){
          document.addEventListener('DOMContentLoaded', start);
        } else {
          start();
        }
      })();
